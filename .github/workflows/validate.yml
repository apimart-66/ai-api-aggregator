name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attribution and pricing data check
        run: python tools/check_links.py
      - name: Smoke-test the catalog tools
        run: |
          python examples/router.py image --model gpt-image-2.5-ext --count 25
          python examples/router.py text --model gpt-5.5 --input-tokens 200000 --output-tokens 30000
          python examples/router.py list --spec token | head -5
