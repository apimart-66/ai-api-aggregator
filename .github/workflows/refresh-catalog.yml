name: refresh-catalog

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild catalog and README tables
        run: python tools/catalog.py
      - name: Validate
        run: python tools/check_links.py
      - name: Commit when the catalog moved
        run: |
          if git diff --quiet; then
            echo "catalog unchanged today"
            exit 0
          fi
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily catalog refresh $(date -u +%Y-%m-%d)"
          git push
